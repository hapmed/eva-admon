# Manifiesto de la EVA (contrato con EVAS Admin). Sin secretos.
# Repositorio de la EVA: https://github.com/hapmed/eva
# Ver docs/EVAS_APPS/REQUISITOS_EVA.md y MANIFEST_EJEMPLO.yaml

code: admon                          # identificador ESTABLE (no cambiar)
name: HAPMED Admon
description: Sistema administrativo HAPMED (clientes, usuarios, configuración y cotizaciones).
image: ghcr.io/hapmed/eva-admon       # repositorio de la imagen (sin tag)

versions:
  - version: "0.1.0"
    status: approved

port: 8000
healthcheck: /healthz

config_schema:
  properties:
    locale:
      type: string
    moneda:
      type: string
    iva_porcentaje:
      type: number
    cliente_prefijo:
      type: string
    cotizacion_prefijo:
      type: string
  required:
    - locale

env:
  - EVAS_EVA_CODE
  - EVAS_INSTALLATION_ID
  - EVAS_CLIENT_REF
  - EVAS_VERSION
  - DATABASE_URL
  - PORT
  - EVA_CLIENT_NAME
  - EVA_JWT_SECRET

secrets:
  - key: DB_PASSWORD
    provider: env
  - key: JWT_SECRET
    provider: env

migrate: "alembic upgrade head"

labels:
  evas.managed_by: evas-admin
  evas.eva_code: admon

resources:
  cpu: "0.5"
  memory: "512Mi"
